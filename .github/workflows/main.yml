name: Construire l'APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ranger les fichiers dans les bons dossiers
        run: |
          set -e
          TMP=$(mktemp -d)
          find . -path ./.git -prune -o -type f \( -name '*.kt' -o -name '*.xml' \) -print -exec cp {} "$TMP"/ \;
          rm -rf app
          J=app/src/main/java/fr/sanimarc/pontbalance
          R=app/src/main/res
          mkdir -p "$J" "$R/layout" "$R/xml" "$R/values"
          cp "$TMP"/*.kt "$J"/
          cp "$TMP"/AndroidManifest.xml app/src/main/
          cp "$TMP"/activity_main.xml "$R/layout/"
          cp "$TMP"/device_filter.xml "$R/xml/"
          cp "$TMP"/strings.xml "$TMP"/themes.xml "$R/values/"
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral(); maven("https://jitpack.io") }
          }
          rootProject.name = "PontBalance"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "fr.sanimarc.pontbalance"
              compileSdk = 34
              defaultConfig {
                  applicationId = "fr.sanimarc.pontbalance"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.github.mik3y:usb-serial-for-android:3.8.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF
          find app -type f
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PontBalance-apk
          path: app/build/outputs/apk/debug/app-debug.apk
